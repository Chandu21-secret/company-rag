<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Company AI Assistant</title>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg: #f4f6f9;
            --white: #ffffff;
            --dark: #1f2937;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --user: #dbeafe;
            --ai: #ffffff;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        body {
            overflow: hidden;
        }

        .app {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* ================= HEADER ================= */

        .header {
            height: 72px;
            flex-shrink: 0;
            background: var(--dark);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            padding-top: env(safe-area-inset-top);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .logo {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: #fff;
            color: var(--dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 17px;
            flex-shrink: 0;
        }

        .brand-text {
            min-width: 0;
        }

        .brand-title {
            font-size: 19px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .brand-subtitle {
            margin-top: 3px;
            font-size: 12px;
            opacity: .7;
        }

        .new-chat {
            border: 1px solid rgba(255,255,255,.35);
            background: transparent;
            color: #fff;
            border-radius: 9px;
            padding: 9px 14px;
            font-size: 13px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .new-chat:active {
            transform: scale(.97);
        }

        /* ================= CHAT ================= */

        .chat-area {
            flex: 1;
            min-height: 0;
            display: flex;
            justify-content: center;
        }

        .chat {
            width: 100%;
            max-width: 1050px;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
            padding: 28px 24px;
            scroll-behavior: smooth;
        }

        /* ================= WELCOME ================= */

        .welcome {
            max-width: 700px;
            margin: 12vh auto 0;
            text-align: center;
            padding: 0 20px;
        }

        .welcome-icon {
            width: 68px;
            height: 68px;
            border-radius: 18px;
            background: var(--dark);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            font-size: 26px;
            font-weight: bold;
        }

        .welcome h1 {
            margin: 0 0 10px;
            font-size: 28px;
        }

        .welcome p {
            margin: 0;
            color: var(--muted);
            line-height: 1.6;
        }

        .suggestions {
            margin-top: 28px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .chip {
            border: 1px solid var(--border);
            background: #fff;
            padding: 10px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            color: var(--text);
        }

        .chip:active {
            transform: scale(.97);
        }

        /* ================= MESSAGE ================= */

        .message-row {
            display: flex;
            margin-bottom: 18px;
            width: 100%;
        }

        .user-row {
            justify-content: flex-end;
        }

        .ai-row {
            justify-content: flex-start;
        }

        .message-wrapper {
            max-width: min(78%, 760px);
        }

        .message-label {
            font-size: 11px;
            color: var(--muted);
            margin-bottom: 5px;
            padding: 0 4px;
        }

        .message {
            padding: 13px 16px;
            border-radius: 16px;
            line-height: 1.6;
            font-size: 15px;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .user-message {
            background: var(--user);
            border-bottom-right-radius: 5px;
        }

        .ai-message {
            background: var(--ai);
            border: 1px solid #edf0f2;
            border-bottom-left-radius: 5px;
            box-shadow: 0 2px 8px rgba(0,0,0,.03);
        }

        /* ================= TYPING ================= */

        .typing {
            display: flex;
            align-items: center;
            gap: 5px;
            background: #fff;
            border: 1px solid #edf0f2;
            width: max-content;
            padding: 13px 16px;
            border-radius: 16px;
            border-bottom-left-radius: 5px;
        }

        .typing span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #9ca3af;
            animation: typing 1.2s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: .2s;
        }

        .typing span:nth-child(3) {
            animation-delay: .4s;
        }

        @keyframes typing {

            0%,
            60%,
            100% {
                opacity: .3;
                transform: translateY(0);
            }

            30% {
                opacity: 1;
                transform: translateY(-3px);
            }

        }

        /* ================= INPUT ================= */

        .input-wrapper {
            flex-shrink: 0;
            background: var(--bg);
            padding: 14px 20px calc(18px + env(safe-area-inset-bottom));
        }

        .input-box {
            width: 100%;
            max-width: 1050px;
            margin: auto;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 8px;
            box-shadow: 0 4px 18px rgba(0,0,0,.06);
        }

        textarea {
            flex: 1;
            resize: none;
            border: none;
            outline: none;
            background: transparent;
            font-family: inherit;
            font-size: 15px;
            line-height: 1.5;
            padding: 10px;
            min-height: 44px;
            max-height: 120px;
            overflow-y: auto;
        }

        .send-button {
            border: none;
            background: var(--dark);
            color: #fff;
            border-radius: 12px;
            height: 44px;
            padding: 0 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
        }

        .send-button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .hint {
            max-width: 1050px;
            margin: 7px auto 0;
            text-align: center;
            color: var(--muted);
            font-size: 11px;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 650px) {

            .header {
                height: 64px;
                padding-left: 14px;
                padding-right: 14px;
            }

            .logo {
                width: 38px;
                height: 38px;
                border-radius: 10px;
                font-size: 15px;
            }

            .brand {
                gap: 9px;
            }

            .brand-title {
                font-size: 16px;
            }

            .brand-subtitle {
                display: none;
            }

            .new-chat {
                padding: 8px 11px;
                font-size: 12px;
            }

            .messages {
                padding: 18px 12px;
            }

            .message-row {
                margin-bottom: 14px;
            }

            .message-wrapper {
                max-width: 92%;
            }

            .message {
                font-size: 14px;
                padding: 12px 14px;
            }

            .welcome {
                margin-top: 8vh;
                padding: 0 12px;
            }

            .welcome-icon {
                width: 58px;
                height: 58px;
                font-size: 22px;
                border-radius: 16px;
            }

            .welcome h1 {
                font-size: 23px;
            }

            .welcome p {
                font-size: 14px;
            }

            .suggestions {
                margin-top: 22px;
                gap: 8px;
            }

            .chip {
                font-size: 12px;
                padding: 9px 12px;
            }

            .input-wrapper {
                padding: 10px 10px calc(12px + env(safe-area-inset-bottom));
            }

            .input-box {
                border-radius: 14px;
                gap: 8px;
            }

            textarea {
                font-size: 16px;
                padding: 9px;
            }

            .send-button {
                height: 42px;
                padding: 0 15px;
                border-radius: 11px;
            }

            .hint {
                display: none;
            }

        }

    </style>

</head>

<body>

<div class="app">

    <header class="header">

        <div class="brand">

            <div class="logo">
                AI
            </div>

            <div class="brand-text">

                <div class="brand-title">
                    Company AI Assistant
                </div>

                <div class="brand-subtitle">
                    Products • Specifications • Dealers
                </div>

            </div>

        </div>

        <button
            class="new-chat"
            onclick="newChat()"
        >
            New Chat
        </button>

    </header>

    <main class="chat-area">

        <div class="chat">

            <div
                id="messages"
                class="messages"
            >

                <div
                    id="welcome"
                    class="welcome"
                >

                    <div class="welcome-icon">
                        AI
                    </div>

                    <h1>
                        How can I help you?
                    </h1>

                    <p>
                        Ask about company products,
                        machine specifications,
                        or dealer information.
                    </p>

                    <div class="suggestions">

                        <button
                            class="chip"
                            onclick="quickAsk('Haryana mein kitne dealers hain?')"
                        >
                            Haryana Dealers
                        </button>

                        <button
                            class="chip"
                            onclick="quickAsk('MBC37SBC ki maximum power kitni hai?')"
                        >
                            MBC37SBC Power
                        </button>

                        <button
                            class="chip"
                            onclick="quickAsk('Aditya Enterprises ka mobile number kya hai?')"
                        >
                            Dealer Mobile
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <div class="input-wrapper">

        <div class="input-box">

            <textarea
                id="question"
                placeholder="Ask your question..."
                rows="1"
            ></textarea>

            <button
                id="send"
                class="send-button"
                onclick="sendQuestion()"
            >
                Send
            </button>

        </div>

        <div class="hint">
            Press Enter to send • Shift + Enter for new line
        </div>

    </div>

</div>

<script>

    let chatHistory = [];

    const input =
        document.getElementById("question");

    const sendButton =
        document.getElementById("send");

    const messages =
        document.getElementById("messages");


    function autoResize() {

        input.style.height = "auto";

        input.style.height =
            Math.min(
                input.scrollHeight,
                120
            ) + "px";

    }


    input.addEventListener(
        "input",
        autoResize
    );


    input.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendQuestion();

            }

        }
    );


    function quickAsk(text) {

        input.value = text;

        autoResize();

        sendQuestion();

    }


    function addMessage(
        text,
        type
    ) {

        const welcome =
            document.getElementById(
                "welcome"
            );

        if (welcome) {
            welcome.remove();
        }


        const row =
            document.createElement("div");

        row.className =
            "message-row " +
            (
                type === "user"
                    ? "user-row"
                    : "ai-row"
            );


        const wrapper =
            document.createElement("div");

        wrapper.className =
            "message-wrapper";


        const label =
            document.createElement("div");

        label.className =
            "message-label";

        label.textContent =
            type === "user"
                ? "You"
                : "AI";


        const message =
            document.createElement("div");

        message.className =
            "message " +
            (
                type === "user"
                    ? "user-message"
                    : "ai-message"
            );

        message.textContent = text;


        wrapper.appendChild(label);

        wrapper.appendChild(message);

        row.appendChild(wrapper);

        messages.appendChild(row);

        scrollToBottom();

    }


    function showTyping() {

        const row =
            document.createElement("div");

        row.id = "typing-row";

        row.className =
            "message-row ai-row";


        const wrapper =
            document.createElement("div");

        wrapper.className =
            "message-wrapper";


        const label =
            document.createElement("div");

        label.className =
            "message-label";

        label.textContent = "AI";


        const typing =
            document.createElement("div");

        typing.className = "typing";

        typing.innerHTML =
            "<span></span>" +
            "<span></span>" +
            "<span></span>";


        wrapper.appendChild(label);

        wrapper.appendChild(typing);

        row.appendChild(wrapper);

        messages.appendChild(row);

        scrollToBottom();

    }


    function hideTyping() {

        const typing =
            document.getElementById(
                "typing-row"
            );

        if (typing) {
            typing.remove();
        }

    }


    function scrollToBottom() {

        requestAnimationFrame(
            function() {

                messages.scrollTop =
                    messages.scrollHeight;

            }
        );

    }


    async function sendQuestion() {

        const question =
            input.value.trim();


        if (!question) {
            return;
        }


        addMessage(
            question,
            "user"
        );


        input.value = "";

        autoResize();


        sendButton.disabled = true;

        sendButton.textContent = "...";


        showTyping();


        try {

            const response =
                await fetch(
                    "/ask",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                question:
                                    question,

                                history:
                                    chatHistory

                            })
                    }
                );


            const data =
                await response.json();


            hideTyping();


            if (!response.ok) {

                throw new Error(
                    data.answer ||
                    "Server error"
                );

            }


            const answer =
                data.answer ||
                "No answer received.";


            addMessage(
                answer,
                "ai"
            );


            chatHistory.push({

                question:
                    question,

                answer:
                    answer

            });


            if (
                chatHistory.length > 10
            ) {

                chatHistory =
                    chatHistory.slice(-10);

            }

        }

        catch (error) {

            hideTyping();


            addMessage(
                "Sorry, something went wrong. Please try again.",
                "ai"
            );


            console.error(error);

        }


        sendButton.disabled = false;

        sendButton.textContent = "Send";

        input.focus();

    }


    function newChat() {

        chatHistory = [];


        messages.innerHTML = `

            <div
                id="welcome"
                class="welcome"
            >

                <div class="welcome-icon">
                    AI
                </div>

                <h1>
                    How can I help you?
                </h1>

                <p>
                    Ask about company products,
                    machine specifications,
                    or dealer information.
                </p>

                <div class="suggestions">

                    <button
                        class="chip"
                        onclick="quickAsk('Haryana mein kitne dealers hain?')"
                    >
                        Haryana Dealers
                    </button>

                    <button
                        class="chip"
                        onclick="quickAsk('MBC37SBC ki maximum power kitni hai?')"
                    >
                        MBC37SBC Power
                    </button>

                    <button
                        class="chip"
                        onclick="quickAsk('Aditya Enterprises ka mobile number kya hai?')"
                    >
                        Dealer Mobile
                    </button>

                </div>

            </div>

        `;


        input.value = "";

        autoResize();

        input.focus();

    }


    autoResize();

    input.focus();

</script>

</body>

</html>
