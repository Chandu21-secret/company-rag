<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Company AI Assistant</title>

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
            color: #1f2937;
            overflow: hidden;
        }


        /* =====================================================
           APP
        ===================================================== */

        .app {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .header {
            width: 100%;
            height: 70px;
            min-height: 70px;
            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 24px;

            background: #1f2937;
            color: white;

            padding-top: env(safe-area-inset-top);
        }

        .brand {
            min-width: 0;
            flex: 1;

            display: flex;
            align-items: center;

            gap: 12px;
        }

        .logo {
            width: 42px;
            height: 42px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background: white;
            color: #1f2937;

            border-radius: 12px;

            font-size: 16px;
            font-weight: 700;
        }

        .brand-text {
            min-width: 0;
        }

        .brand-title {
            font-size: 19px;
            font-weight: 700;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .brand-subtitle {
            margin-top: 3px;

            font-size: 12px;

            color: rgba(255,255,255,.7);

            white-space: nowrap;
        }

        .new-chat {
            flex-shrink: 0;

            margin-left: 12px;

            border: 1px solid rgba(255,255,255,.35);

            background: transparent;

            color: white;

            border-radius: 9px;

            padding: 9px 14px;

            font-size: 13px;

            cursor: pointer;

            white-space: nowrap;
        }

        .new-chat:active {
            transform: scale(.97);
        }


        /* =====================================================
           CHAT AREA
        ===================================================== */

        .chat-area {
            width: 100%;
            min-width: 0;
            min-height: 0;

            flex: 1;

            display: flex;
            justify-content: center;

            overflow: hidden;
        }

        .chat {
            width: 100%;
            max-width: 1050px;

            min-width: 0;
            min-height: 0;

            display: flex;
            flex-direction: column;
        }

        .messages {
            width: 100%;
            min-width: 0;
            min-height: 0;

            flex: 1;

            overflow-y: auto;
            overflow-x: hidden;

            padding: 28px 24px;

            scroll-behavior: smooth;

            overscroll-behavior: contain;

            -webkit-overflow-scrolling: touch;
        }


        /* =====================================================
           WELCOME
        ===================================================== */

        .welcome {
            width: 100%;
            max-width: 700px;

            margin: 12vh auto 0;

            padding: 0 20px;

            text-align: center;
        }

        .welcome-icon {
            width: 68px;
            height: 68px;

            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #1f2937;
            color: white;

            border-radius: 18px;

            font-size: 25px;
            font-weight: 700;
        }

        .welcome h1 {
            margin: 0 0 10px;

            font-size: 28px;
            line-height: 1.2;
        }

        .welcome p {
            margin: 0;

            color: #6b7280;

            font-size: 15px;

            line-height: 1.6;
        }

        .suggestions {
            margin-top: 28px;

            display: flex;

            flex-wrap: wrap;

            justify-content: center;

            gap: 10px;
        }

        .chip {
            border: 1px solid #e5e7eb;

            background: white;

            color: #1f2937;

            border-radius: 20px;

            padding: 10px 14px;

            font-size: 13px;

            cursor: pointer;
        }

        .chip:active {
            transform: scale(.97);
        }


        /* =====================================================
           MESSAGES
        ===================================================== */

        .message-row {
            width: 100%;

            display: flex;

            margin-bottom: 18px;
        }

        .user-row {
            justify-content: flex-end;
        }

        .ai-row {
            justify-content: flex-start;
        }

        .message-wrapper {
            max-width: min(78%, 760px);

            min-width: 0;
        }

        .message-label {
            margin-bottom: 5px;

            padding: 0 4px;

            color: #6b7280;

            font-size: 11px;
        }

        .message {
            max-width: 100%;

            padding: 13px 16px;

            border-radius: 16px;

            font-size: 15px;

            line-height: 1.6;

            white-space: pre-wrap;

            word-break: break-word;

            overflow-wrap: anywhere;
        }

        .user-message {
            background: #dbeafe;

            border-bottom-right-radius: 5px;
        }

        .ai-message {
            background: white;

            border: 1px solid #edf0f2;

            border-bottom-left-radius: 5px;

            box-shadow: 0 2px 8px rgba(0,0,0,.03);
        }


        /* =====================================================
           TYPING
        ===================================================== */

        .typing {
            width: max-content;

            display: flex;
            align-items: center;

            gap: 5px;

            padding: 13px 16px;

            background: white;

            border: 1px solid #edf0f2;

            border-radius: 16px;

            border-bottom-left-radius: 5px;
        }

        .typing span {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #9ca3af;

            animation: typing 1.2s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: .2s;
        }

        .typing span:nth-child(3) {
            animation-delay: .4s;
        }

        @keyframes typing {

            0%,
            60%,
            100% {
                opacity: .3;
                transform: translateY(0);
            }

            30% {
                opacity: 1;
                transform: translateY(-3px);
            }

        }


        /* =====================================================
           INPUT AREA
        ===================================================== */

        .input-wrapper {
            width: 100%;

            flex-shrink: 0;

            background: #f4f6f9;

            padding: 14px 20px;

            padding-bottom:
                calc(
                    14px +
                    env(safe-area-inset-bottom)
                );
        }

        .input-box {
            width: 100%;
            max-width: 1050px;

            margin: 0 auto;

            display: flex;
            align-items: flex-end;

            gap: 10px;

            padding: 8px;

            background: white;

            border: 1px solid #e5e7eb;

            border-radius: 16px;

            box-shadow:
                0 4px 18px rgba(0,0,0,.06);
        }

        textarea {
            width: 100%;
            min-width: 0;

            flex: 1;

            resize: none;

            border: none;
            outline: none;

            background: transparent;

            font-family: inherit;

            font-size: 15px;

            line-height: 1.5;

            padding: 10px;

            min-height: 44px;
            max-height: 120px;

            overflow-y: auto;
        }

        textarea::placeholder {
            color: #9ca3af;
        }

        .send-button {
            flex-shrink: 0;

            height: 44px;

            padding: 0 20px;

            border: none;

            border-radius: 12px;

            background: #1f2937;

            color: white;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;
        }

        .send-button:disabled {
            opacity: .5;

            cursor: not-allowed;
        }

        .send-button:active {
            transform: scale(.97);
        }

        .hint {
            width: 100%;
            max-width: 1050px;

            margin: 7px auto 0;

            text-align: center;

            color: #6b7280;

            font-size: 11px;
        }


        /* =====================================================
           TABLET
        ===================================================== */

        @media (max-width: 800px) {

            .header {
                padding-left: 16px;
                padding-right: 16px;
            }

            .messages {
                padding-left: 16px;
                padding-right: 16px;
            }

            .input-wrapper {
                padding-left: 14px;
                padding-right: 14px;
            }

            .message-wrapper {
                max-width: 86%;
            }

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 650px) {

            html,
            body {
                width: 100%;
                height: 100%;

                overflow: hidden;
            }

            .app {
                width: 100%;
                height: 100vh;
                height: 100dvh;
            }


            /* HEADER */

            .header {
                height: 62px;
                min-height: 62px;

                padding-left: 10px;
                padding-right: 10px;
            }

            .brand {
                gap: 8px;

                overflow: hidden;
            }

            .logo {
                width: 38px;
                height: 38px;

                border-radius: 10px;

                font-size: 14px;
            }

            .brand-title {
                font-size: 16px;
            }

            .brand-subtitle {
                display: none;
            }

            .new-chat {
                margin-left: 6px;

                padding: 8px 10px;

                font-size: 12px;
            }


            /* CHAT */

            .messages {
                padding: 18px 10px;

                padding-bottom: 18px;
            }


            /* WELCOME */

            .welcome {
                margin-top: 7vh;

                padding-left: 10px;
                padding-right: 10px;
            }

            .welcome-icon {
                width: 58px;
                height: 58px;

                margin-bottom: 15px;

                border-radius: 16px;

                font-size: 21px;
            }

            .welcome h1 {
                font-size: 23px;
            }

            .welcome p {
                font-size: 14px;
            }

            .suggestions {
                margin-top: 20px;

                gap: 7px;
            }

            .chip {
                padding: 9px 12px;

                font-size: 12px;
            }


            /* MESSAGES */

            .message-row {
                margin-bottom: 14px;
            }

            .message-wrapper {
                max-width: 92%;
            }

            .message {
                padding: 11px 13px;

                font-size: 14px;

                line-height: 1.55;
            }

            .message-label {
                font-size: 10px;

                margin-bottom: 4px;
            }


            /* INPUT */

            .input-wrapper {
                padding: 9px 8px;

                padding-bottom:
                    calc(
                        9px +
                        env(safe-area-inset-bottom)
                    );
            }

            .input-box {
                padding: 6px;

                gap: 6px;

                border-radius: 14px;
            }

            textarea {
                min-height: 42px;

                padding: 9px 8px;

                font-size: 16px;

                line-height: 1.45;
            }

            .send-button {
                height: 42px;

                padding: 0 14px;

                border-radius: 11px;

                font-size: 13px;
            }

            .hint {
                display: none;
            }

        }


        /* =====================================================
           VERY SMALL MOBILE
        ===================================================== */

        @media (max-width: 380px) {

            .header {
                padding-left: 7px;
                padding-right: 7px;
            }

            .brand {
                gap: 6px;
            }

            .logo {
                width: 35px;
                height: 35px;
            }

            .brand-title {
                font-size: 14px;
            }

            .new-chat {
                padding: 7px 8px;

                font-size: 11px;
            }

            .message-wrapper {
                max-width: 94%;
            }

            .send-button {
                padding-left: 11px;
                padding-right: 11px;
            }

        }

    </style>

</head>


<body>

<div class="app">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">

        <div class="brand">

            <div class="logo">
                AI
            </div>

            <div class="brand-text">

                <div class="brand-title">
                    Company AI Assistant
                </div>

                <div class="brand-subtitle">
                    Products • Specifications • Dealers
                </div>

            </div>

        </div>


        <button
            class="new-chat"
            id="newChatButton"
            type="button"
        >
            New Chat
        </button>

    </header>



    <!-- =====================================================
         CHAT
    ====================================================== -->

    <main class="chat-area">

        <div class="chat">

            <div
                id="messages"
                class="messages"
            >


                <!-- WELCOME -->

                <div
                    id="welcome"
                    class="welcome"
                >

                    <div class="welcome-icon">
                        AI
                    </div>


                    <h1>
                        How can I help you?
                    </h1>


                    <p>
                        Ask about company products,
                        machine specifications,
                        or dealer information.
                    </p>


                    <div class="suggestions">


                        <button
                            class="chip"
                            type="button"
                            data-question="Haryana mein kitne dealers hain?"
                        >
                            Haryana Dealers
                        </button>


                        <button
                            class="chip"
                            type="button"
                            data-question="MBC37SBC ki maximum power kitni hai?"
                        >
                            MBC37SBC Power
                        </button>


                        <button
                            class="chip"
                            type="button"
                            data-question="Aditya Enterprises ka mobile number kya hai?"
                        >
                            Dealer Mobile
                        </button>


                    </div>

                </div>

            </div>

        </div>

    </main>



    <!-- =====================================================
         INPUT
    ====================================================== -->

    <div class="input-wrapper">

        <div class="input-box">


            <textarea
                id="question"
                rows="1"
                placeholder="Ask your question..."
                autocomplete="off"
                autocorrect="on"
                autocapitalize="sentences"
                spellcheck="true"
            ></textarea>


            <button
                id="send"
                class="send-button"
                type="button"
            >
                Send
            </button>


        </div>


        <div class="hint">
            Press Enter to send • Shift + Enter for new line
        </div>

    </div>

</div>



<script>

    /* =====================================================
       VARIABLES
    ===================================================== */

    let chatHistory = [];

    let isSending = false;


    const input =
        document.getElementById("question");

    const sendButton =
        document.getElementById("send");

    const messages =
        document.getElementById("messages");

    const newChatButton =
        document.getElementById("newChatButton");



    /* =====================================================
       AUTO RESIZE TEXTAREA
    ===================================================== */

    function autoResize() {

        input.style.height = "auto";

        input.style.height =
            Math.min(
                input.scrollHeight,
                120
            ) + "px";

    }



    /* =====================================================
       SCROLL
    ===================================================== */

    function scrollToBottom() {

        requestAnimationFrame(
            function() {

                messages.scrollTop =
                    messages.scrollHeight;

            }
        );

    }



    /* =====================================================
       ADD MESSAGE
    ===================================================== */

    function addMessage(
        text,
        type
    ) {

        const welcome =
            document.getElementById("welcome");


        if (welcome) {

            welcome.remove();

        }


        const row =
            document.createElement("div");


        row.className =
            "message-row " +
            (
                type === "user"
                    ? "user-row"
                    : "ai-row"
            );


        const wrapper =
            document.createElement("div");


        wrapper.className =
            "message-wrapper";


        const label =
            document.createElement("div");


        label.className =
            "message-label";


        label.textContent =
            type === "user"
                ? "You"
                : "AI";


        const message =
            document.createElement("div");


        message.className =
            "message " +
            (
                type === "user"
                    ? "user-message"
                    : "ai-message"
            );


        message.textContent =
            text;


        wrapper.appendChild(
            label
        );


        wrapper.appendChild(
            message
        );


        row.appendChild(
            wrapper
        );


        messages.appendChild(
            row
        );


        scrollToBottom();

    }



    /* =====================================================
       TYPING
    ===================================================== */

    function showTyping() {

        hideTyping();


        const row =
            document.createElement("div");


        row.id =
            "typing-row";


        row.className =
            "message-row ai-row";


        const wrapper =
            document.createElement("div");


        wrapper.className =
            "message-wrapper";


        const label =
            document.createElement("div");


        label.className =
            "message-label";


        label.textContent =
            "AI";


        const typing =
            document.createElement("div");


        typing.className =
            "typing";


        typing.innerHTML =
            "<span></span>" +
            "<span></span>" +
            "<span></span>";


        wrapper.appendChild(
            label
        );


        wrapper.appendChild(
            typing
        );


        row.appendChild(
            wrapper
        );


        messages.appendChild(
            row
        );


        scrollToBottom();

    }



    function hideTyping() {

        const typing =
            document.getElementById(
                "typing-row"
            );


        if (typing) {

            typing.remove();

        }

    }



    /* =====================================================
       SEND QUESTION
    ===================================================== */

    async function sendQuestion() {

        if (isSending) {

            return;

        }


        const question =
            input.value.trim();


        if (!question) {

            return;

        }


        isSending = true;


        addMessage(
            question,
            "user"
        );


        input.value = "";


        autoResize();


        sendButton.disabled = true;

        sendButton.textContent = "...";


        showTyping();


        try {


            const response =
                await fetch(
                    "/ask",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                question:
                                    question,

                                history:
                                    chatHistory

                            })
                    }
                );


            let data = {};


            try {

                data =
                    await response.json();

            }

            catch (jsonError) {

                data = {};

            }


            hideTyping();


            if (!response.ok) {

                throw new Error(
                    data.answer ||
                    "Server error"
                );

            }


            const answer =
                data.answer ||
                "No answer received.";


            addMessage(
                answer,
                "ai"
            );


            chatHistory.push({

                question:
                    question,

                answer:
                    answer

            });


            /* Keep last 10 messages */

            if (
                chatHistory.length > 10
            ) {

                chatHistory =
                    chatHistory.slice(-10);

            }

        }


        catch (error) {


            console.error(
                "Chat error:",
                error
            );


            hideTyping();


            addMessage(
                "Sorry, something went wrong. Please try again.",
                "ai"
            );

        }


        finally {


            isSending = false;


            sendButton.disabled =
                false;


            sendButton.textContent =
                "Send";


            input.focus();


            scrollToBottom();

        }

    }



    /* =====================================================
       NEW CHAT
    ===================================================== */

    function newChat() {

        chatHistory = [];


        messages.innerHTML = `

            <div
                id="welcome"
                class="welcome"
            >

                <div class="welcome-icon">
                    AI
                </div>


                <h1>
                    How can I help you?
                </h1>


                <p>
                    Ask about company products,
                    machine specifications,
                    or dealer information.
                </p>


                <div class="suggestions">


                    <button
                        class="chip"
                        type="button"
                        data-question="Haryana mein kitne dealers hain?"
                    >
                        Haryana Dealers
                    </button>


                    <button
                        class="chip"
                        type="button"
                        data-question="MBC37SBC ki maximum power kitni hai?"
                    >
                        MBC37SBC Power
                    </button>


                    <button
                        class="chip"
                        type="button"
                        data-question="Aditya Enterprises ka mobile number kya hai?"
                    >
                        Dealer Mobile
                    </button>


                </div>

            </div>

        `;


        input.value = "";


        autoResize();


        input.focus();

    }



    /* =====================================================
       EVENT LISTENERS
    ===================================================== */

    sendButton.addEventListener(
        "click",
        sendQuestion
    );


    newChatButton.addEventListener(
        "click",
        newChat
    );


    input.addEventListener(
        "input",
        autoResize
    );


    input.addEventListener(
        "keydown",
        function(event) {


            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendQuestion();

            }

        }
    );


    /* Quick question buttons */

    document.addEventListener(
        "click",
        function(event) {


            const chip =
                event.target.closest(
                    ".chip"
                );


            if (!chip) {

                return;

            }


            const question =
                chip.dataset.question;


            if (!question) {

                return;

            }


            input.value =
                question;


            autoResize();


            sendQuestion();

        }
    );


    /* Initial */

    autoResize();

</script>


</body>

</html>
